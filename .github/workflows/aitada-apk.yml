name: Aitada APK Derle

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Dosya tam mi kontrol et
        run: |
          if ! grep -q "END-OF-WORKF[L]OW" .github/workflows/aitada-apk.yml; then
            echo "::error::Dosya yarim yapistirilmis. Kodu Kopyala dugmesiyle bastan sona kopyalayin."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Generate project files
        run: |
          set -e
          rm -rf app
          D=app/src/main/java/com/aitada/agent
          mkdir -p $D app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Aitada"
          include(":app")
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.aitada.agent'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.aitada.agent'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Aitada"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentService"
                      android:exported="true"
                      android:label="Aitada Ajan"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:notificationTimeout="100"
              android:settingsActivity="com.aitada.agent.MainActivity" />
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_description">Aitada, yapay zeka ajanının ekranı okumasına ve dokunmasına izin verir.</string>
          </resources>
          EOF

          cat > $D/App.kt << 'EOF'
          package com.aitada.agent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          data class AgentConfig(val url: String, val apiKey: String, val model: String)

          object AgentBus {
              @Volatile var service: AgentService? = null
              @Volatile var running = false
              @Volatile var listener: ((String) -> Unit)? = null
              private val lock = Any()
              private val buffer = StringBuilder()

              fun log(message: String) {
                  val stamp = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  val line = "[$stamp] $message"
                  synchronized(lock) {
                      buffer.append(line).append('\n')
                      if (buffer.length > 30000) buffer.delete(0, 10000)
                  }
                  listener?.invoke(line)
              }

              fun snapshot(): String = synchronized(lock) { buffer.toString() }
          }

          class LlmClient(private val cfg: AgentConfig) {
              private val anthropic = cfg.url.contains("anthropic.com", true)

              fun complete(system: String, user: String): String {
                  val body = JSONObject().put("model", cfg.model)
                  val userMsg = JSONObject().put("role", "user").put("content", user)
                  if (anthropic) {
                      body.put("max_tokens", 1024).put("system", system).put("messages", JSONArray().put(userMsg))
                  } else {
                      val sysMsg = JSONObject().put("role", "system").put("content", system)
                      body.put("messages", JSONArray().put(sysMsg).put(userMsg))
                  }
                  var u = cfg.url.trim().trimEnd('/')
                  if (!u.startsWith("http")) u = "https://$u"
                  if (!u.endsWith("/chat/completions") && !u.endsWith("/messages")) {
                      u += if (anthropic) (if (u.endsWith("/v1")) "/messages" else "/v1/messages") else "/chat/completions"
                  }
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 90000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  if (anthropic) {
                      c.setRequestProperty("x-api-key", cfg.apiKey)
                      c.setRequestProperty("anthropic-version", "2023-06-01")
                  } else {
                      c.setRequestProperty("Authorization", "Bearer " + cfg.apiKey)
                  }
                  try {
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      val text = (if (code in 200..299) c.inputStream else c.errorStream)
                          ?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw RuntimeException("HTTP $code: " + text.take(300))
                      val j = JSONObject(text)
                      if (anthropic) {
                          val arr = j.getJSONArray("content")
                          return (0 until arr.length()).joinToString("") { arr.getJSONObject(it).optString("text") }
                      }
                      val content = j.getJSONArray("choices").getJSONObject(0).getJSONObject("message").opt("content")
                      if (content is JSONArray) {
                          return (0 until content.length()).joinToString("") {
                              content.optJSONObject(it)?.optString("text").orEmpty()
                          }
                      }
                      return if (content is String) content else ""
                  } finally {
                      c.disconnect()
                  }
              }
          }

          class AgentService : AccessibilityService() {

              private class Item(val node: AccessibilityNodeInfo, val rect: Rect, val line: String)

              private val mainHandler = Handler(Looper.getMainLooper())
              @Volatile private var stopRequested = false
              @Volatile private var items: List<Item> = emptyList()
              private var overlay: Button? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  AgentBus.service = this
                  AgentBus.log("Erişilebilirlik servisi bağlandı.")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  stopRequested = true
                  AgentBus.service = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopRequested = true
                  AgentBus.service = null
                  super.onDestroy()
              }

              fun startTask(task: String, cfg: AgentConfig) {
                  if (AgentBus.running) return
                  stopRequested = false
                  AgentBus.running = true
                  showOverlay()
                  Thread({ runAgent(task, cfg) }, "aitada-agent").start()
              }

              fun stopTask() {
                  stopRequested = true
                  AgentBus.log("Durdurma isteği alındı.")
              }

              private fun runAgent(task: String, cfg: AgentConfig) {
                  val client = LlmClient(cfg)
                  val history = ArrayList<String>()
                  var bad = 0
                  AgentBus.log("Görev başladı: $task")
                  try {
                      for (step in 1..MAX_STEPS) {
                          if (stopRequested) {
                              AgentBus.log("Görev durduruldu.")
                              return
                          }
                          val prompt = buildPrompt(task, step, history, captureScreen())
                          AgentBus.log("Adım $step/$MAX_STEPS: model yanıtı bekleniyor...")
                          val reply = ask(client, prompt)
                          if (reply == null) {
                              if (!stopRequested) AgentBus.log("Model yanıt veremedi, görev iptal edildi.")
                              return
                          }
                          val action = parseAction(reply)
                          if (action == null) {
                              bad++
                              AgentBus.log("Geçersiz model yanıtı: " + reply.take(160))
                              if (bad >= 3) {
                                  AgentBus.log("Model art arda 3 kez geçersiz yanıt verdi, görev iptal edildi.")
                                  return
                              }
                              history.add("Step $step: invalid reply, answer with ONE JSON object only")
                              continue
                          }
                          bad = 0
                          val type = action.optString("action").trim().lowercase()
                          val thought = action.optString("thought").trim()
                          if (thought.isNotEmpty()) AgentBus.log("Düşünce: $thought")
                          if (type == "done" || type == "fail") {
                              val label = if (type == "done") "Görev tamamlandı: " else "Görev tamamlanamadı: "
                              AgentBus.log(label + action.optString("message"))
                              return
                          }
                          val result = execute(type, action)
                          val compact = JSONObject(action.toString())
                          compact.remove("thought")
                          AgentBus.log("Eylem: $compact -> $result")
                          history.add("Step $step: $compact -> $result")
                          if (history.size > 12) history.removeAt(0)
                          if (type != "wait") pause(1200)
                      }
                      AgentBus.log("En yüksek adım sayısına ulaşıldı, görev durduruldu.")
                  } catch (e: Exception) {
                      AgentBus.log("Beklenmeyen hata: " + e.message)
                  } finally {
                      AgentBus.running = false
                      hideOverlay()
                      AgentBus.log("Ajan durdu.")
                  }
              }

              private fun ask(client: LlmClient, prompt: String): String? {
                  for (attempt in 1..3) {
                      if (stopRequested) return null
                      try {
                          return client.complete(SYSTEM_PROMPT, prompt)
                      } catch (e: Exception) {
                          val msg = e.message ?: e.javaClass.simpleName
                          AgentBus.log("API hatası (deneme $attempt/3): $msg")
                          if (msg.startsWith("HTTP 401") || msg.startsWith("HTTP 403") || msg.startsWith("HTTP 404")) return null
                          pause(2000L * attempt)
                      }
                  }
                  return null
              }

              private fun parseAction(reply: String): JSONObject? {
                  val start = reply.indexOf('{')
                  val end = reply.lastIndexOf('}')
                  if (start < 0 || end <= start) return null
                  return try {
                      JSONObject(reply.substring(start, end + 1))
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun buildPrompt(task: String, step: Int, history: List<String>, screen: String): String {
                  val sb = StringBuilder()
                  sb.append("TASK: ").append(task).append("\n\nSTEP: ").append(step).append(" of ").append(MAX_STEPS)
                  sb.append("\n\nPREVIOUS ACTIONS:\n")
                  if (history.isEmpty()) sb.append("(none)\n") else history.forEach { sb.append(it).append('\n') }
                  sb.append("\nCURRENT SCREEN:\n").append(screen).append("\nRespond with exactly one JSON object.")
                  return sb.toString()
              }

              private fun captureScreen(): String {
                  var root: AccessibilityNodeInfo? = null
                  for (i in 1..5) {
                      root = rootInActiveWindow
                      if (root != null) break
                      pause(400)
                  }
                  val list = ArrayList<Item>()
                  val pkg = root?.packageName?.toString() ?: "unknown"
                  if (root != null) collect(root, list, 0)
                  items = list
                  val dm = resources.displayMetrics
                  val sb = StringBuilder()
                  sb.append("Foreground app package: ").append(pkg).append('\n')
                  sb.append("Screen size: ").append(dm.widthPixels).append('x').append(dm.heightPixels).append('\n')
                  if (list.isEmpty()) sb.append("(no readable elements)\n")
                  for (i in list.indices) sb.append('[').append(i).append("] ").append(list[i].line).append('\n')
                  return sb.toString()
              }

              private fun collect(node: AccessibilityNodeInfo, out: MutableList<Item>, depth: Int) {
                  if (out.size >= MAX_ELEMENTS || depth > 40 || !node.isVisibleToUser) return
                  val text = if (node.isPassword) "" else node.text?.toString()?.trim().orEmpty()
                  val desc = node.contentDescription?.toString()?.trim().orEmpty()
                  val id = node.viewIdResourceName?.substringAfterLast('/').orEmpty()
                  val interactive = node.isClickable || node.isLongClickable || node.isEditable ||
                      node.isScrollable || node.isCheckable
                  if (text.isNotEmpty() || desc.isNotEmpty() || interactive) {
                      val r = Rect()
                      node.getBoundsInScreen(r)
                      if (r.width() > 0 && r.height() > 0) {
                          val flags = ArrayList<String>()
                          if (node.isClickable) flags.add("cl
