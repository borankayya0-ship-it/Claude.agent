name: Build Aitada APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Generate Gradle project
        run: |
          set -e
          P=aitada_build
          mkdir -p $P/app/src/main/java/com/aitada/agent $P/app/src/main/res/xml $P/app/src/main/res/values

          cat > $P/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Aitada"
          include(":app")
          EOF

          cat > $P/build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > $P/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > $P/app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.aitada.agent'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.aitada.agent'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Aitada"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AgentService"
                      android:exported="true"
                      android:label="Aitada Ajan"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/service_description"
              android:notificationTimeout="100"
              android:settingsActivity="com.aitada.agent.MainActivity" />
          EOF

          cat > $P/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="service_description">Aitada, yapay zeka ajanının ekranı okumasına ve dokunmasına izin verir.</string>
          </resources>
          EOF

      - name: Generate Kotlin sources (bus and LLM client)
        run: |
          set -e
          D=aitada_build/app/src/main/java/com/aitada/agent

          cat > $D/AgentBus.kt << 'EOF'
          package com.aitada.agent

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class AgentConfig(val url: String, val apiKey: String, val model: String)

          object AgentBus {
              @Volatile var service: AgentService? = null
              @Volatile var running: Boolean = false
              @Volatile var listener: ((String) -> Unit)? = null

              private val lock = Any()
              private val buffer = StringBuilder()

              fun log(message: String) {
                  val stamp = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  val line = "[$stamp] $message"
                  synchronized(lock) {
                      buffer.append(line).append('\n')
                      if (buffer.length > 30000) buffer.delete(0, buffer.length - 20000)
                  }
                  listener?.invoke(line)
              }

              fun snapshot(): String = synchronized(lock) { buffer.toString() }
          }
          EOF

          cat > $D/LlmClient.kt << 'EOF'
          package com.aitada.agent

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class LlmClient(private val cfg: AgentConfig) {

              private val isAnthropic = cfg.url.contains("anthropic.com", ignoreCase = true)

              fun complete(system: String, user: String): String {
                  val body = JSONObject()
                  body.put("model", cfg.model)
                  if (isAnthropic) {
                      body.put("max_tokens", 1024)
                      body.put("system", system)
                      body.put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", user)))
                  } else {
                      body.put(
                          "messages",
                          JSONArray()
                              .put(JSONObject().put("role", "system").put("content", system))
                              .put(JSONObject().put("role", "user").put("content", user))
                      )
                  }

                  val conn = URL(buildEndpoint()).openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.connectTimeout = 20000
                  conn.readTimeout = 90000
                  conn.doOutput = true
                  conn.setRequestProperty("Content-Type", "application/json")
                  if (isAnthropic) {
                      conn.setRequestProperty("x-api-key", cfg.apiKey)
                      conn.setRequestProperty("anthropic-version", "2023-06-01")
                  } else {
                      conn.setRequestProperty("Authorization", "Bearer " + cfg.apiKey)
                  }

                  try {
                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      if (code !in 200..299) throw RuntimeException("HTTP " + code + ": " + text.take(400))
                      return parse(text)
                  } finally {
                      conn.disconnect()
                  }
              }

              private fun buildEndpoint(): String {
                  var u = cfg.url.trim().trimEnd('/')
                  if (!u.startsWith("http://") && !u.startsWith("https://")) u = "https://" + u
                  if (u.endsWith("/chat/completions") || u.endsWith("/messages")) return u
                  return if (isAnthropic) {
                      if (u.endsWith("/v1")) u + "/messages" else u + "/v1/messages"
                  } else {
                      u + "/chat/completions"
                  }
              }

              private fun parse(raw: String): String {
                  val json = JSONObject(raw)
                  if (isAnthropic) {
                      val arr = json.getJSONArray("content")
                      val sb = StringBuilder()
                      for (i in 0 until arr.length()) {
                          val part = arr.getJSONObject(i)
                          if (part.optString("type") == "text") sb.append(part.optString("text"))
                      }
                      return sb.toString()
                  }
                  val msg = json.getJSONArray("choices").getJSONObject(0).getJSONObject("message")
                  return when (val content = msg.opt("content")) {
                      is String -> content
                      is JSONArray -> {
                          val sb = StringBuilder()
                          for (i in 0 until content.length()) {
                              sb.append(content.optJSONObject(i)?.optString("text").orEmpty())
                          }
                          sb.toString()
                      }
                      else -> ""
                  }
              }
          }
          EOF

      - name: Generate Kotlin sources (accessibility agent service)
        run: |
          set -e
          D=aitada_build/app/src/main/java/com/aitada/agent

          cat > $D/AgentService.kt << 'EOF'
          package com.aitada.agent

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Button
          import org.json.JSONObject
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class AgentService : AccessibilityService() {

              private class UiItem(val node: AccessibilityNodeInfo, val bounds: Rect, val line: String)

              private val mainHandler = Handler(Looper.getMainLooper())

              @Volatile private var stopRequested = false
              @Volatile private var items: List<UiItem> = emptyList()
              private var overlay: Button? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  AgentBus.service = this
                  AgentBus.log("Erişilebilirlik servisi bağlandı.")
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  stopRequested = true
                  AgentBus.service = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopRequested = true
                  AgentBus.service = null
                  super.onDestroy()
              }

              // ---------- Görev yönetimi ----------

              fun startTask(task: String, cfg: AgentConfig) {
                  if (AgentBus.running) {
                      AgentBus.log("Zaten çalışan bir görev var.")
                      return
                  }
                  stopRequested = false
                  AgentBus.running = true
                  showOverlay()
                  Thread({ runAgent(task, cfg) }, "aitada-agent").start()
              }

              fun stopTask() {
                  stopRequested = true
                  AgentBus.log("Durdurma isteği alındı.")
              }

              private fun runAgent(task: String, cfg: AgentConfig) {
                  val client = LlmClient(cfg)
                  val history = ArrayList<String>()
                  var badReplies = 0
                  AgentBus.log("Görev başladı: $task")
                  try {
                      for (step in 1..MAX_STEPS) {
                          if (stopRequested) {
                              AgentBus.log("Görev kullanıcı tarafından durduruldu.")
                              return
                          }
                          val screen = captureScreen()
                          AgentBus.log("Adım $step/$MAX_STEPS: model yanıtı bekleniyor...")
                          val reply = ask(client, buildPrompt(task, step, history, screen))
                          if (reply == null) {
                              if (!stopRequested) AgentBus.log("Model yanıt veremedi, görev iptal edildi.")
                              return
                          }
                          val action = parseAction(reply)
                          if (action == null) {
                              badReplies++
                              AgentBus.log("Geçersiz model yanıtı: " + reply.take(160))
                              if (badReplies >= 3) {
                                  AgentBus.log("Model art arda 3 kez geçersiz yanıt verdi, görev iptal edildi.")
                                  return
                              }
                              history.add("Step $step: invalid reply, answer with ONE JSON object only")
                              continue
                          }
                          badReplies = 0
                          val type = action.optString("action").trim().lowercase()
                          val thought = action.optString("thought").trim()
                          if (thought.isNotEmpty()) AgentBus.log("Düşünce: $thought")
                          if (type == "done") {
                              AgentBus.log("Görev tamamlandı: " + action.optString("message"))
                              return
                          }
                          if (type == "fail") {
                              AgentBus.log("Görev tamamlanamadı: " + action.optString("message"))
                              return
                          }
                          val result = execute(type, action)
                          val compact = JSONObject(action.toString())
                          compact.remove("thought")
                          AgentBus.log("Eylem: $compact -> $result")
                          history.add("Step $step: $compact -> $result")
                          if (history.size > 12) history.removeAt(0)
                          if (type != "wait") pause(1200)
                      }
                      AgentBus.log("En yüksek adım sayısına ulaşıldı, görev durduruldu.")
                  } catch (e: Exception) {
                      AgentBus.log("Beklenmeyen hata: " + e.message)
                  } finally {
                      AgentBus.running = false
                      hideOverlay()
                      AgentBus.log("Ajan durdu.")
                  }
              }

              private fun ask(client: LlmClient, prompt: String): String? {
                  for (attempt in 1..3) {
                      if (stopRequested) return null
                      try {
                          return client.complete(SYSTEM_PROMPT, prompt)
                      } catch (e: Exception) {
                          val msg = e.message ?: e.javaClass.simpleName
                          AgentBus.log("API hatası (deneme $attempt/3): $msg")
                          if (msg.startsWith("HTTP 401") || msg.startsWith("HTTP 403") || msg.startsWith("HTTP 404")) return null
                          pause(2000L * attempt)
                      }
                  }
                  return null
              }

              private fun parseAction(reply: String): JSONObject? {
                  val start = reply.indexOf('{')
                  val end = reply.lastIndexOf('}')
                  if (start < 0 || end <= start) return null
                  return try {
                      JSONObject(reply.substring(start, end + 1))
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun buildPrompt(task: String, step: Int, history: List<String>, screen: String): String {
                  val sb = StringBuilder()
                  sb.append("TASK: ").append(task).append("\n\n")
                  sb.append("STEP: ").append(step).append(" of ").append(MAX_STEPS).append("\n\n")
                  sb.append("PREVIOUS ACTIONS:\n")
                  if (history.isEmpty()) sb.append("(none)\n") else history.forEach { sb.append(it).append('\n') }
                  sb.append("\nCURRENT SCREEN:\n").append(screen)
                  sb.append("\nRespond with exactly one JSON object.")
                  return sb.toString()
              }

              // ---------- Ekran okuma ----------

              private fun captureScreen(): String {
                  var root: AccessibilityNodeInfo? = null
                  for (i in 1..5) {
                      root = rootInActiveWindow
                      if (root != null) break
                      pause(400)
                  }
                  val list = ArrayList<UiItem>()
                  val pkg = root?.packageName?.toString() ?: "unknown"
                  if (root != null) collect(root, list, 0)
                  items = list
                  val dm = resources.displayMetrics
                  val sb = StringBuilder()
                  sb.append
