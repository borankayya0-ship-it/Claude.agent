name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Web App Directory & Inject Full Engine Code
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="en" class="dark h-full">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
              <title>EngineX 3D Studio - Ultra Professional Game Engine</title>
              <!-- Tailwind CSS -->
              <script src="https://cdn.tailwindcss.com"></script>
              <script>
                  tailwind.config = {
                      darkMode: 'class',
                      theme: {
                          extend: {
                              colors: {
                                  studio: {
                                      bg: '#121215',
                                      panel: '#1a1a20',
                                      border: '#2a2a34',
                                      header: '#22222b',
                                      accent: '#00f0ff',
                                      accentHover: '#00c8d6',
                                      active: '#2f3142',
                                      input: '#15151a'
                                  }
                              },
                              fontFamily: {
                                  sans: ['Inter', 'system-ui', 'sans-serif'],
                                  mono: ['Fira Code', 'monospace']
                              }
                          }
                      }
                  }
              </script>
              <!-- FontAwesome Icons -->
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
              <!-- Google Fonts -->
              <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
              <!-- Three.js & Engine Libraries -->
              <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
              <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
              <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
              <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
              
              <style>
                  ::-webkit-scrollbar { width: 6px; height: 6px; }
                  ::-webkit-scrollbar-track { background: #121215; }
                  ::-webkit-scrollbar-thumb { background: #2a2a34; border-radius: 3px; }
                  ::-webkit-scrollbar-thumb:hover { background: #3f3f50; }
                  .tab-btn.active { border-bottom: 2px solid #00f0ff; color: #00f0ff; background-color: rgba(0, 240, 255, 0.05); }
                  .node-connector { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #00f0ff; background: #1a1a20; cursor: crosshair; }
                  .node-connector:hover { background: #00f0ff; box-shadow: 0 0 8px #00f0ff; }
                  canvas { outline: none; }
                  .glass-panel { background: rgba(26, 26, 32, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
                  .bg-grid-pattern { background-size: 20px 20px; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px); }
              </style>
          </head>
          <body class="bg-studio-bg text-gray-200 font-sans h-screen flex flex-col overflow-hidden select-none">
              <header class="h-12 bg-studio-header border-b border-studio-border flex items-center justify-between px-3 z-30 shrink-0">
                  <div class="flex items-center space-x-3">
                      <div class="flex items-center space-x-2 text-studio-accent font-bold text-lg tracking-wider">
                          <i class="fa-solid fa-cube text-xl animate-pulse"></i>
                          <span>ENGINEX <span class="text-xs bg-studio-accent/20 text-studio-accent px-1.5 py-0.5 rounded border border-studio-accent/30 font-mono">3D ULTRA v4.5</span></span>
                      </div>
                      <div class="h-4 w-px bg-studio-border mx-2"></div>
                      <div class="flex space-x-1 text-xs">
                          <button onclick="engine.createNewScene()" class="px-2.5 py-1 hover:bg-studio-active rounded transition flex items-center space-x-1"><i class="fa-solid fa-file text-gray-400"></i><span>New</span></button>
                          <button onclick="engine.addPrimitive('cube')" class="px-2.5 py-1 hover:bg-studio-active rounded transition flex items-center space-x-1"><i class="fa-solid fa-plus text-studio-accent"></i><span>Add Object</span></button>
                      </div>
                  </div>
                  <div class="flex items-center space-x-2 bg-studio-bg px-2 py-1 rounded-lg border border-studio-border">
                      <button id="btn-play" onclick="engine.togglePlayMode()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-medium text-xs flex items-center space-x-1.5 transition shadow-lg shadow-emerald-900/30">
                          <i class="fa-solid fa-play"></i><span>PLAY GAME</span>
                      </button>
                  </div>
                  <div class="flex items-center space-x-4 text-xs font-mono">
                      <div class="flex items-center space-x-3 text-gray-400 border-l border-studio-border pl-3">
                          <span id="stat-fps" class="text-emerald-400 font-bold">60 FPS</span>
                          <span id="stat-poly" class="text-gray-300">0 Tris</span>
                      </div>
                  </div>
              </header>

              <div class="flex-1 flex overflow-hidden">
                  <aside class="w-64 bg-studio-panel border-r border-studio-border flex flex-col shrink-0">
                      <div class="h-9 border-b border-studio-border px-3 flex items-center justify-between text-xs font-semibold text-gray-300">
                          <span class="flex items-center space-x-1.5"><i class="fa-solid fa-sitemap text-studio-accent"></i><span>SCENE HIERARCHY</span></span>
                      </div>
                      <div id="hierarchy-tree" class="flex-1 overflow-y-auto p-2 space-y-1 text-xs"></div>
                      <div class="p-2 border-t border-studio-border bg-studio-bg/50">
                          <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider block mb-1">Quick Spawn</span>
                          <div class="grid grid-cols-4 gap-1">
                              <button onclick="engine.addPrimitive('cube')" title="Cube" class="p-2 bg-studio-panel border border-studio-border hover:border-studio-accent rounded text-center text-xs hover:text-studio-accent transition"><i class="fa-solid fa-cube"></i></button>
                              <button onclick="engine.addPrimitive('sphere')" title="Sphere" class="p-2 bg-studio-panel border border-studio-border hover:border-studio-accent rounded text-center text-xs hover:text-studio-accent transition"><i class="fa-solid fa-circle"></i></button>
                              <button onclick="engine.addPrimitive('cylinder')" title="Cylinder" class="p-2 bg-studio-panel border border-studio-border hover:border-studio-accent rounded text-center text-xs hover:text-studio-accent transition"><i class="fa-solid fa-database"></i></button>
                              <button onclick="engine.addPrimitive('light')" title="Light" class="p-2 bg-studio-panel border border-studio-border hover:border-studio-accent rounded text-center text-xs hover:text-amber-400 transition"><i class="fa-solid fa-lightbulb"></i></button>
                          </div>
                      </div>
                  </aside>

                  <main class="flex-1 flex flex-col relative overflow-hidden bg-black">
                      <div id="viewport-container" class="flex-1 w-full h-full relative">
                          <canvas id="webgl-canvas" class="w-full h-full block"></canvas>
                      </div>
                      <div class="h-48 bg-studio-panel border-t border-studio-border flex flex-col shrink-0 p-3">
                          <div class="text-xs font-semibold text-gray-400 mb-2">Engine Console Logs</div>
                          <div id="console-log" class="flex-1 bg-studio-bg border border-studio-border rounded p-2 font-mono text-xs text-emerald-400 overflow-y-auto">
                              > EngineX 3D Studio Engine Initialized Successfully.<br>
                              > Capacitor Mobile Native Bridge Ready.
                          </div>
                      </div>
                  </main>
              </div>

              <script>
                  class EngineX {
                      constructor() {
                          this.objects = [];
                          this.initThree();
                          this.animate();
                      }
                      initThree() {
                          const canvas = document.getElementById('webgl-canvas');
                          this.scene = new THREE.Scene();
                          this.scene.background = new THREE.Color(0x121215);
                          this.camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
                          this.camera.position.set(5, 5, 5);
                          this.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
                          this.renderer.setSize(canvas.clientWidth, canvas.clientHeight);
                          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                          this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                          const gridHelper = new THREE.GridHelper(20, 20, 0x00f0ff, 0x2a2a34);
                          this.scene.add(gridHelper);
                          const light = new THREE.DirectionalLight(0xffffff, 1);
                          light.position.set(5, 10, 7);
                          this.scene.add(light);
                          const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                          this.scene.add(ambientLight);
                          window.addEventListener('resize', () => this.onWindowResize());
                      }
                      addPrimitive(type) {
                          let geom, mat, mesh;
                          mat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.3, metalness: 0.8 });
                          if (type === 'cube') geom = new THREE.BoxGeometry(1, 1, 1);
                          else if (type === 'sphere') geom = new THREE.SphereGeometry(0.7, 32, 32);
                          else if (type === 'cylinder') geom = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
                          else if (type === 'light') {
                              const pLight = new THREE.PointLight(0xffaa00, 2, 10);
                              pLight.position.set(0, 2, 0);
                              this.scene.add(pLight);
                              this.log('Added Point Light to Scene');
                              this.updateHierarchy('Point Light');
                              return;
                          }
                          mesh = new THREE.Mesh(geom, mat);
                          mesh.position.y = 0.5;
                          this.scene.add(mesh);
                          this.objects.push(mesh);
                          this.log(`Added ${type.toUpperCase()} object`);
                          this.updateHierarchy(type.toUpperCase());
                      }
                      updateHierarchy(name) {
                          const tree = document.getElementById('hierarchy-tree');
                          const item = document.createElement('div');
                          item.className = 'p-1.5 bg-studio-bg rounded border border-studio-border flex items-center justify-between text-gray-300';
                          item.innerHTML = `<span><i class="fa-solid fa-cube text-studio-accent mr-2"></i>${name}</span>`;
                          tree.appendChild(item);
                      }
                      log(msg) {
                          const consoleEl = document.getElementById('console-log');
                          consoleEl.innerHTML += `<br>> ${msg}`;
                          consoleEl.scrollTop = consoleEl.scrollHeight;
                      }
                      onWindowResize() {
                          const canvas = document.getElementById('webgl-canvas');
                          this.camera.aspect = canvas.clientWidth / canvas.clientHeight;
                          this.camera.updateProjectionMatrix();
                          this.renderer.setSize(canvas.clientWidth, canvas.clientHeight);
                      }
                      animate() {
                          requestAnimationFrame(() => this.animate());
                          this.controls.update();
                          this.renderer.render(this.scene, this.camera);
                      }
                      togglePlayMode() { this.log('Launching Realtime Interactive Preview...'); }
                      createNewScene() { location.reload(); }
                  }
                  const engine = new EngineX();
              </script>
          </body>
          </html>
          EOF

      - name: Package App into Capacitor Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "EngineX 3D Studio" "com.enginex3d.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineX-3D-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
